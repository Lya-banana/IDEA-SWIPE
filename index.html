<body>
<div class="app"><header class="topbar"><div class="brand"><div class="mark">↗</div><div><div class="brand-title">IDEA SWIPE <span style="font-size:10px;opacity:.5;font-weight:500">/ 灵感划片</span></div><div class="brand-sub">FROM OUTPUT TO UNDERSTANDING</div></div></div><nav class="steps" id="steps"></nav><div class="header-end"><div class="autosave" id="saveStatus">已自动保存</div><button class="reset-btn" id="resetBtn" title="清空当前项目">↺ 重置</button></div></header><div class="shell"><aside class="side-left" id="left"></aside><main class="main" id="main"></main><aside class="side-right" id="right"></aside></div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const STORAGE='idea-swipe-demo-v1';
const seedIdeas=[
{title:'校园寻宝式交换',summary:'把闲置物品交换设计成一次城市寻宝，让流动的物品成为校园线索。',core:'地图线索 + 拍照打卡 + 线下交换点',tags:['游戏化','线下体验','校园社交'],icon:'🗺️',kind:'空间体验',detail:'每个闲置物品关联一个坐标和简短故事。学生通过线索找到交换点，扫码查看物品信息，完成物主与新主人的交接。'},
{title:'物品漂流日记',summary:'让每件二手物品拥有一本可以持续书写的数字日记。',core:'物品身份码 + 使用故事 + 历任主人',tags:['情感联结','可持续','故事化'],icon:'📖',kind:'情感设计',detail:'学生扫描物品上的专属二维码，阅读前一位拥有者写下的故事，并在使用之后继续追加一页。'},
{title:'一小时交换快闪',summary:'在宿舍区做限时开放的迷你交换站，降低线下交易和沟通的压力。',core:'定时快闪 + 无需议价 + 轻量交付',tags:['线下体验','低成本','社区'],icon:'⏱️',kind:'服务机制',detail:'根据校园作息安排固定的一小时快闪活动。线上提前登记，线下集中交换，结束后自动关闭匹配。'},
{title:'兴趣交换盲盒',summary:'用共同兴趣匹配陌生人的物品，保留拆盒的惊喜，也给用户保底选择权。',core:'兴趣匹配 + 惊喜机制 + 二次确认',tags:['随机性','校园社交','趣味互动'],icon:'🎁',kind:'体验机制',detail:'先填写兴趣偏好和不可接受类型，再由系统匹配可能喜欢的物品；在确认取件前仍能查看和拒绝。'},
{title:'毕业季记忆交易所',summary:'将毕业生离校闲置物品和校园回忆一起传递给新生。',core:'毕业季主题 + 故事标签 + 学长学姐连接',tags:['情感联结','故事化','校园社交'],icon:'🎓',kind:'文化活动',detail:'推出毕业季限定专题。每件物品附带原主人写下的使用回忆和对新主人的一句祝福。'},
{title:'宿舍楼下交换地图',summary:'把距离最近的可交换物品标在地图上，让寻找闲置像查看附近咖啡一样简单。',core:'附近地图 + 实时状态 + 安全取件点',tags:['数字地图','低成本','实用工具'],icon:'📍',kind:'数字产品',detail:'按宿舍楼、学院和物品类别查看可交换资源。只展示安全的公共交接区域，不公开具体寝室地址。'},
{title:'技能换物小剧场',summary:'用个人技能或微小帮助交换闲置物品，让没有预算的人也能参与。',core:'技能清单 + 双向匹配 + 信任评价',tags:['互助社区','非货币交换','校园社交'],icon:'🎭',kind:'社群机制',detail:'每人可以发布自己能提供的服务，如拍照、修图或教软件。物主可选择技能交换而非金钱交易。'},
{title:'物品的新生活提案',summary:'用 AI 给没人领取的旧物生成二次利用灵感和改造教程。',core:'拍照识别 + 改造建议 + 共创教程',tags:['AI辅助','可持续','创意改造'],icon:'✨',kind:'AI辅助',detail:'拍摄旧物照片，系统生成三种难度的改造想法。用户可记录改造过程，也可发起材料交换。'},
{title:'反悔友好的交换机制',summary:'允许双方在短暂冷静期内重新考虑，减少一次冲动交换造成的后悔。',core:'缓冲期 + 双方确认 + 信任机制',tags:['用户体验','信任机制','低压力'],icon:'🫧',kind:'服务规则',detail:'物品交接前提供一个清晰的确认窗口。短时退出无需解释，已约好的时段自动释放给其他用户。'},
{title:'闲置物品故事展',summary:'把部分交换故事陈列在校园公共区域，让闲置流通成为一次微型展览。',core:'线下展陈 + 故事征集 + 社区共创',tags:['线下体验','故事化','文化活动'],icon:'🪄',kind:'校园装置',detail:'征集有故事的闲置，设计便于阅读的展签；参观者可扫码预约交换，也能为物品写下新用途建议。'}];
const palette=['#d7f0b2','#e8dcfa','#ffe9ca','#d9ece4','#fbe0df','#ecedbf'];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr=s=>safe(s);
const $=s=>document.querySelector(s);
const defaultState=()=>({stage:'browse',topic:'校园闲置物品交换',cards:[],blocked:[],chat:[{role:'assistant',text:'你好！我是你的灵感搭档。\n说说你想探索什么设计主题，我会把方向拆成可以逐张判断的创意卡片。'}],duel:null,winner:null,round:0});
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||defaultState();if(!Array.isArray(state.cards)||!Array.isArray(state.blocked))throw Error('bad')}catch(e){state=defaultState()}
let aiConnected=false,aiModel='';let toastTimer,undoSnapshot=null,mapScale=.78,mapX=70,mapY=18,mapFilter='all',mapSelected=null,dragSession=null,longTimer=null,modal={type:null,selected:[],cardId:null,customTags:[]},mapInitialized=false;
const likes=()=>state.cards.filter(c=>c.status==='like'||c.status==='super');const supers=()=>state.cards.filter(c=>c.status==='super');const remaining=()=>state.cards.filter(c=>!c.status&&!(c.tags||[]).some(t=>state.blocked.includes(t)));const active=()=>remaining()[0];
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));$('#saveStatus').textContent='已自动保存'}catch(e){$('#saveStatus').textContent='仅本次会话'}}
function id(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function snapshot(){undoSnapshot=JSON.stringify(state)}
function toast(msg,canUndo=false){clearTimeout(toastTimer);$('#toastRoot').innerHTML=`<div class="toast"><span>${safe(msg)}</span>${canUndo?'<button id="undoToast">撤销</button>':''}<button id="hideToast" style="font-size:15px;color:#fff9">×</button></div>`;toastTimer=setTimeout(()=>{$('#toastRoot').innerHTML=''},4600);$('#undoToast')?.addEventListener('click',undo);$('#hideToast')?.addEventListener('click',()=>$('#toastRoot').innerHTML='')}
function undo(){if(!undoSnapshot)return;state=JSON.parse(undoSnapshot);undoSnapshot=null;persist();render();toast('已撤销上一步')}
function generateIdeas(prompt){const topic=(prompt||state.topic||'校园创意').replace(/[。！!?？]/g,'').trim().slice(0,36);const isCampus=/校园|闲置|二手|交换|毕业|宿舍/.test(topic);const nouns=topic.replace(/^(帮我|请|设计|关于|我想|针对|为|如何|想做|帮忙|探索|生成|一个|一些)/g,'').slice(0,15)||'这个主题';const templates=[
['地图式探索','把「'+nouns+'」整理成可漫游的空间地图，让用户通过地点找到相关机会。','空间线索 + 地点触发 + 参与记录',['空间体验','线下体验','游戏化'],'🗺️','空间交互'],
['情感故事档案','让每一次参与都留下简短故事，逐步形成可以被回顾的集体记忆。','参与记录 + 个人故事 + 可视化展示',['情感联结','故事化','社区'],'📚','叙事设计'],
['限时快闪实验','通过低门槛、短时间的线下快闪活动，快速验证'+nouns+'的参与动力。','预约入口 + 限时体验 + 现场反馈',['线下体验','低成本','快速验证'],'⏱️','服务设计'],
['惊喜盲盒互动','以偏好匹配代替纯随机分配，增加好奇心并保留自主选择权。','偏好匹配 + 随机体验 + 再次确认',['随机性','趣味互动','个性化'],'🎁','体验机制'],
['共创提案墙','让每个人给出一条微小建议，再由其他参与者拼成集体方案。','用户投稿 + 点赞拼接 + 公开反馈',['共创','校园社交','社区'],'🧩','社群机制'],
['附近的灵感导航','将分散的信息按距离、场景与时间整理成一个可探索的列表。','情境筛选 + 智能排序 + 位置地图',['数字地图','实用工具','低成本'],'📍','信息设计'],
['互助技能交换','不强调经济交易，而通过技能、时间与经验形成互助网络。','双向发布 + 能力匹配 + 安全确认',['互助社区','非货币交换','校园社交'],'🤝','服务机制'],
['AI 创意改造台','让 AI 基于用户上传的素材，提出数个可实施但风格不同的改造方向。','输入素材 + AI 建议 + 人工取舍',['AI辅助','创意改造','可持续'],'✨','AI工具'],
['低压力参与机制','设计可取消、可后悔、可暂停的互动步骤，让初次参与的人放心尝试。','渐进承诺 + 退出机制 + 轻量提示',['信任机制','用户体验','低压力'],'🫧','行为设计'],
['流动的主题展览','把参与成果变成不断更新的线下微型展览，吸引不同人群加入。','动态展示 + 故事征集 + 社区分享',['文化活动','故事化','线下体验'],'🎨','文化活动']];
let list=(isCampus?seedIdeas:templates.map(([title,summary,core,tags,icon,kind])=>({title,summary,core,tags,icon,kind,detail:`围绕「${topic}」的方向：${summary} 推荐从低成本原型开始，邀请 3–5 位目标用户参与试玩并收集反馈。`})));
const iteration=Math.max(0,(state.round||1)-1);return list.map((c,i)=>({...c,id:id(),title:iteration&&i%3===0?c.title+' · 进阶版':c.title,summary:iteration&&i%3===0?c.summary+' 本轮重点尝试更轻量的实现方式。':c.summary,status:null,chosenTags:[],reason:'',round:iteration})).filter(c=>!c.tags.some(t=>state.blocked.includes(t)));
}
async function createBatch(input){const prompt=(input||'').trim();if(!prompt){toast('先输入一个想探索的主题');return}let liveIdeas=null,mode='演示';if(aiConnected){const send=$('#sendPrompt');if(send){send.disabled=true;send.textContent='✳ AI 正在生成…'}try{const res=await fetch('/api/ideas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:prompt,blocked:state.blocked})});const json=await res.json();if(!res.ok)throw Error(json.error||'接口返回异常');if(!Array.isArray(json.ideas)||!json.ideas.length)throw Error('未返回有效卡片');liveIdeas=json.ideas;mode='实时 AI'}catch(err){toast('实时生成失败，改用本地演示：'+(err?.message||'网络错误'))}}snapshot();state.topic=prompt;state.round=(state.round||0)+1;const batch=(liveIdeas?liveIdeas.map(c=>({...c,id:id(),status:null,chosenTags:[],reason:'',round:state.round,detail:c.detail||c.summary,tags:Array.isArray(c.tags)?c.tags:[]})).filter(c=>!c.tags.some(t=>state.blocked.includes(t))):generateIdeas(prompt));state.cards.push(...batch);state.chat.push({role:'user',text:prompt},{role:'assistant',text:`${mode==='实时 AI'?'AI 已生成':'已准备好'} ${batch.length} 张关于「${prompt}」的点子卡。你可以右滑喜欢、上滑非常喜欢、左滑不喜欢；长按屏蔽不感兴趣的标签。${batch.length?'':'目前的屏蔽标签过滤掉了所有候选，请先解除部分屏蔽。'}`});state.stage='browse';state.duel=null;state.winner=null;persist();render();toast(`生成了 ${batch.length} 张${mode==='实时 AI'?' AI':'演示'}创意卡`)}
function assess(status,cardId){const c=state.cards.find(x=>x.id===(cardId||active()?.id));if(!c)return;if(status==='super'){openTagModal(c,'super');return}snapshot();c.status=status;persist();render();toast(status==='like'?'已喜欢并存入喜爱地图':status==='no'?'已标记不喜欢':'已暂存，稍后可以回看',true)}
function finishSuper(){let c=state.cards.find(x=>x.id===modal.cardId);if(!c)return;snapshot();c.status='super';c.chosenTags=[...modal.selected];closeModal();persist();render();toast('已标记「非常喜欢」，标签已保存',true)}
function blockTags(){let c=state.cards.find(x=>x.id===modal.cardId);if(!c)return;if(!modal.selected.length){toast('请至少选择一个要屏蔽的标签');return}snapshot();state.blocked=[...new Set([...state.blocked,...modal.selected])];if(!c.status)c.status='no';closeModal();persist();render();toast(`已屏蔽 ${modal.selected.length} 个标签，后续候选将跳过相关点子`,true)}
function removeBlock(tag){snapshot();state.blocked=state.blocked.filter(t=>t!==tag);persist();render();toast('已解除屏蔽：'+tag,true)}
function startMap(){if(likes().length===0){toast('请先至少喜欢一张卡片');return}state.stage='map';mapInitialized=false;mapFilter='all';mapSelected=likes()[0]?.id;persist();render()}
function startCompare(){const arr=likes();if(arr.length===0){toast('还没有可以比较的喜欢卡片');return}state.duel={ids:arr.map(c=>c.id),champion:arr[0].id,index:1,history:[]};state.winner=null;state.stage='compare';if(arr.length===1){state.winner=arr[0].id;state.stage='winner'}persist();render()}
function vote(id){if(!state.duel)return;const d=state.duel;d.history.push({champion:d.champion,index:d.index});d.champion=id;d.index++;if(d.index>=d.ids.length){state.winner=d.champion;state.stage='winner'}persist();render();if(state.stage==='winner')toast('你的本轮最爱已经选出来了！')}
function undoVote(){if(!state.duel?.history.length)return;const prev=state.duel.history.pop();state.duel.champion=prev.champion;state.duel.index=prev.index;persist();render()}
function stepNav(stage){if(stage==='browse'){state.stage='browse';persist();render()}else if(stage==='map')startMap();else if(stage==='compare'){if(state.duel&&state.duel.ids.length===likes().length){state.stage='compare';persist();render()}else startCompare()}}
function renderSteps(){const opts=[['browse','01','卡片判断'],['map','02','喜爱地图'],['compare','03','二选一']];const idx={browse:0,map:1,compare:2,winner:2}[state.stage]||0;$('#steps').innerHTML=opts.map(([key,n,title],i)=>`${i?'<span class="connector"></span>':''}<button class="step ${i===idx?'active':i<idx?'done':''}" data-step="${key}"><span class="num">${i<idx?'✓':n}</span>${title}</button>`).join('')}

function initSwipe(c){const el=$('#swipeCard');if(!el)return;let start=null,moved=false,longTriggered=false;const clearLong=()=>{clearTimeout(longTimer);longTimer=null};el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(e.button!==0&&e.pointerType==='mouse')return;start={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};moved=false;longTriggered=false;el.setPointerCapture(e.pointerId);clearLong();longTimer=setTimeout(()=>{if(start&&!moved){longTriggered=true;start=null;resetCard();openTagModal(c,'block')}},630)});el.addEventListener('pointermove',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>11){moved=true;clearLong()}if(!moved)return;el.classList.add('dragging');el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*.035}deg)`;showOverlays(el,dx,dy)});const resetCard=()=>{el.classList.remove('dragging');el.style.transform='';el.querySelectorAll('.swipe-overlay').forEach(x=>x.style.opacity=0)};const end=e=>{clearLong();if(longTriggered){longTriggered=false;return}if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;resetCard();if(dy < -92&&Math.abs(dy)>Math.abs(dx)*.8)assess('super',c.id);else if(dx>90&&Math.abs(dx)>Math.abs(dy)*.75)assess('like',c.id);else if(dx< -90&&Math.abs(dx)>Math.abs(dy)*.75)assess('no',c.id)};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{clearLong();start=null;resetCard()});el.addEventListener('contextmenu',e=>{e.preventDefault();clearLong();start=null;resetCard();openTagModal(c,'block')})}
function showOverlays(el,dx,dy){const yes=el.querySelector('.yes'),no=el.querySelector('.no'),superlike=el.querySelector('.superlike');yes.style.opacity=dx>0&&Math.abs(dx)>Math.abs(dy)?Math.min(.9,dx/100):0;no.style.opacity=dx<0&&Math.abs(dx)>Math.abs(dy)?Math.min(.9,-dx/100):0;superlike.style.opacity=dy<0&&Math.abs(dy)>=Math.abs(dx)?Math.min(.95,-dy/105):0}

function addCustom(){let v=$('#customTag')?.value.trim().replace(/^#/,'').slice(0,18);if(!v)return;if(state.blocked.includes(v)&&modal.type!=='block'){toast('该标签已被屏蔽，请先解除屏蔽');return}if(!modal.selected.includes(v))modal.selected.push(v);if(!modal.customTags.includes(v))modal.customTags.push(v);renderModal()}

function renderMap(){const selected=state.cards.find(c=>c.id===mapSelected)||likes()[0];mapSelected=selected?.id||null;const all=likes(),shown=all.filter(c=>mapFilter==='all'||mapFilter==='super'&&c.status==='super'||mapFilter.startsWith('tag:')&&(c.chosenTags.includes(mapFilter.slice(4))||c.tags.includes(mapFilter.slice(4))));const tagCounts={};all.forEach(c=>[...(c.chosenTags.length?c.chosenTags:c.tags)].forEach(t=>tagCounts[t]=(tagCounts[t]||0)+1));const topTags=Object.keys(tagCounts).sort((a,b)=>tagCounts[b]-tagCounts[a]).slice(0,4);$('#main').classList.add('wide');$('#main').innerHTML=head('02 / YOUR LOVE MAP','让喜欢的方向，浮现出来。',`保留的 ${all.length} 个点子一目了然。紫色卡片代表「非常喜欢」；滚轮或按钮缩放，拖动画布查看。`,`<button class="pill-cta" id="mapToCompare" ${!all.length?'disabled':''}>开始二选一 ↗</button>`) + `<div class="map-toolbar"><div class="filters"><button class="filter ${mapFilter==='all'?'active':''}" data-filter="all">全部 ${all.length}</button><button class="filter ${mapFilter==='super'?'active':''}" data-filter="super">✦ 非常喜欢 ${supers().length}</button>${topTags.map(t=>`<button class="filter ${mapFilter==='tag:'+t?'active':''}" data-filter="tag:${escapeAttr(t)}"># ${safe(t)}</button>`).join('')}</div><div class="map-tools"><button class="tool-button" id="zoomOut" title="缩小">−</button><span class="zoom-text" id="zoomText">${Math.round(mapScale*100)}%</span><button class="tool-button" id="zoomIn" title="放大">+</button><button class="tool-button" id="fitMap" title="适应屏幕">⤢</button></div></div><div class="map-layout"><div class="map-viewport" id="mapViewport"><div class="map-world" id="mapWorld"><div class="world-label" style="left:85px;top:22px">YOUR IDEAS, YOUR TASTE.</div>${shown.map((c,i)=>{const p=coords(all.indexOf(c),all.length);return `<button class="map-node ${c.status==='super'?'super':''} ${c.id===mapSelected?'selected':''}" data-map-id="${c.id}" style="left:${p.x}px;top:${p.y}px"><div class="node-index"><span>IDEA ${String(all.indexOf(c)+1).padStart(2,'0')}</span><span>${c.status==='super'?'✦ VERY LIKE':'♡ LIKE'}</span></div><h3>${safe(c.title)}</h3><p>${safe(c.summary)}</p><div class="node-tags">${(c.chosenTags.length?c.chosenTags:c.tags).slice(0,3).map(t=>`<span># ${safe(t)}</span>`).join('')}</div></button>`}).join('')}</div><div class="map-watermark">✥ 拖动平移 · 滚轮缩放 · 点击卡片查看</div></div><div class="map-detail" id="mapDetail">${renderMapDetail(selected)}</div></div><div style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;margin-top:16px"><div class="legend"><span><i class="legend-dot"></i>有点喜欢</span><span><i class="legend-dot purple"></i>非常喜欢</span></div><button class="ghost-link" id="mapBack">← 继续判断卡片</button></div>`;$('#mapToCompare').onclick=startCompare;$('#mapBack').onclick=()=>stepNav('browse');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{mapFilter=b.dataset.filter;renderMap()});document.querySelectorAll('[data-map-id]').forEach(b=>b.onclick=e=>{mapSelected=b.dataset.mapId;$('#mapDetail').innerHTML=renderMapDetail(state.cards.find(x=>x.id===mapSelected));document.querySelectorAll('.map-node').forEach(el=>el.classList.toggle('selected',el.dataset.mapId===mapSelected));attachMapDetail()});$('#zoomOut').onclick=()=>changeZoom(mapScale/1.22);$('#zoomIn').onclick=()=>changeZoom(mapScale*1.22);$('#fitMap').onclick=fitMap;attachMapDetail();initMap();if(!mapInitialized){requestAnimationFrame(fitMap);mapInitialized=true}else applyMapTransform()}
function renderMapDetail(c){if(!c)return `<div class="hint-text">暂无符合筛选条件的点子。</div>`;return `<div class="detail-icon">${c.icon}</div><div class="detail-status">${c.status==='super'?'✦ VERY LIKE / 非常喜欢':'♡ LIKE / 有点喜欢'}</div><h3>${safe(c.title)}</h3><p>${safe(c.detail||c.summary)}</p><div class="detail-tags">${(c.chosenTags?.length?c.chosenTags:c.tags).map(t=>`<span># ${safe(t)}</span>`).join('')}</div><div class="detail-buttons"><button class="btn-small" id="editMapTags">✎ 编辑标签</button><button class="btn-small" id="toggleSuper">${c.status==='super'?'降为喜欢':'✦ 设为非常喜欢'}</button></div>`}

function initMap(){const vp=$('#mapViewport');if(!vp)return;vp.addEventListener('wheel',e=>{e.preventDefault();const rect=vp.getBoundingClientRect(),localX=e.clientX-rect.left,localY=e.clientY-rect.top;changeZoom(mapScale*(e.deltaY<0?1.12:.89),localX,localY)},{passive:false});let pan=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.map-node'))return;pan={x:e.clientX,y:e.clientY,startX:mapX,startY:mapY,id:e.pointerId};vp.setPointerCapture(e.pointerId);vp.classList.add('grabbing')});vp.addEventListener('pointermove',e=>{if(!pan||e.pointerId!==pan.id)return;mapX=pan.startX+e.clientX-pan.x;mapY=pan.startY+e.clientY-pan.y;applyMapTransform()});const end=()=>{pan=null;vp.classList.remove('grabbing')};vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end)}

function fitMap(){const vp=$('#mapViewport');if(!vp)return;const w=vp.clientWidth,h=vp.clientHeight;const n=likes().length,cols=Math.max(3,Math.min(5,Math.ceil(Math.sqrt(n*1.5)))),rows=Math.ceil(n/cols);let contentW=Math.min(1180,85+(Math.min(n,cols)-1)*1000/cols+350),contentH=Math.min(960,110+(rows-1)*230+280);mapScale=Math.min(1.06,Math.max(.35,Math.min((w-50)/contentW,(h-50)/contentH)));mapX=(w-contentW*mapScale)/2-20*mapScale;mapY=(h-contentH*mapScale)/2;applyMapTransform()}
function changeZoom(to,cx,cy){const vp=$('#mapViewport');if(!vp)return;const ns=Math.max(.3,Math.min(2,to));const ax=cx??vp.clientWidth/2,ay=cy??vp.clientHeight/2;mapX=ax-(ax-mapX)*ns/mapScale;mapY=ay-(ay-mapY)*ns/mapScale;mapScale=ns;applyMapTransform()}
function duelCard(c,which){return `<article class="duel-card"><div class="eyebrow">OPTION ${which}</div><div class="duel-icon">${c.icon}</div><h2>${safe(c.title)}</h2><p>${safe(c.summary)}</p><div class="duel-tags">${(c.chosenTags?.length?c.chosenTags:c.tags).slice(0,4).map(t=>`<span># ${safe(t)}</span>`).join('')}</div><button class="pill-cta ${which==='B'?'accent':''}" data-vote="${c.id}">选这个点子 ${which==='A'?'↖':'↗'}</button></article>`}
function renderCompare(){const d=state.duel;if(!d||d.ids.length!==likes().length){startCompare();return}if(d.index>=d.ids.length){state.winner=d.champion;state.stage='winner';render();return}const a=state.cards.find(c=>c.id===d.champion),b=state.cards.find(c=>c.id===d.ids[d.index]);if(!a||!b){startCompare();return}$('#main').innerHTML=`<div class="compare-wrap">${head('03 / PAIRWISE CHOICE','如果只能留下一个？','在两张卡片中选出更喜欢的一张。胜者会和下一个点子继续比较。')}<div class="duel-meta"><span class="eyebrow">ROUND ${String(d.index).padStart(2,'0')} / ${String(d.ids.length-1).padStart(2,'0')}</span><div class="duel-progress"><div style="width:${(d.index-1)/(d.ids.length-1)*100}%"></div></div><button class="ghost-link" id="undoDuel" ${!d.history.length?'disabled':''}>↶ 上一步</button></div><div class="duel-area">${duelCard(a,'A')}<div class="vs">VS</div>${duelCard(b,'B')}</div><div class="duel-note">每次只比较两个方向 · 使用 <span class="kbd">1</span> 或 <span class="kbd">2</span> 快速选择</div><div style="text-align:center;margin-top:27px"><button class="ghost-link" id="duelBack">← 返回喜爱地图</button></div></div>`;document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote));$('#undoDuel').onclick=undoVote;$('#duelBack').onclick=startMap}
function renderWinner(){const c=state.cards.find(x=>x.id===state.winner);if(!c){startCompare();return}$('#main').innerHTML=`<div class="win-shell"><div class="win-trophy">✦</div><div class="eyebrow">04 / THE FINAL FAVORITE</div><h1>你的心动之选，<br>终于浮现。</h1><p style="font-size:13px;color:#7e8e7f;line-height:1.8">在 ${likes().length} 个喜欢的方向里，经过 ${Math.max(0,likes().length-1)} 次二选一，最终留下了这个想法。</p><div class="winner-card"><div class="eyebrow" style="margin-bottom:15px">✦ THE ONE</div><div style="font-size:32px;margin-bottom:14px">${c.icon}</div><div class="winner-name">${safe(c.title)}</div><p>${safe(c.summary)}</p><div class="detail-tags">${(c.chosenTags.length?c.chosenTags:c.tags).map(t=>`<span># ${safe(t)}</span>`).join('')}</div><div class="core-line"><strong>核心机制：</strong>${safe(c.core)}</div></div><div class="win-actions"><button class="pill-cta" id="exportJson">↓ 导出完整偏好记录</button><button class="pill-cta secondary" id="exportMd">↓ 导出概念摘要</button><button class="pill-cta secondary" id="againCompare">↺ 重新二选一</button></div><button class="ghost-link" style="margin-top:22px" id="winnerToMap">← 返回喜爱地图</button></div>`;$('#exportJson').onclick=exportJson;$('#exportMd').onclick=exportMarkdown;$('#againCompare').onclick=startCompare;$('#winnerToMap').onclick=startMap}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJson(){download('IDEA-SWIPE-偏好记录.json',JSON.stringify({project:state.topic,exportedAt:new Date().toISOString(),liked:likes(),superLiked:supers(),blockedTags:state.blocked,allCards:state.cards,winner:state.cards.find(x=>x.id===state.winner)||null,duelHistory:state.duel?.history||[]},null,2),'application/json;charset=utf-8');toast('JSON 偏好记录已导出')}
function exportMarkdown(){const c=state.cards.find(x=>x.id===state.winner);const md=`# IDEA SWIPE · 设计概念摘要\n\n**探索课题：** ${state.topic}\n\n**最终最喜欢：** ${c?.title||'未确定'}\n\n${c?.summary||''}\n\n## 核心机制\n${c?.core||''}\n\n## 非常喜欢的点子\n${supers().map(x=>`- **${x.title}**：${x.summary}\n  - 偏好标签：${(x.chosenTags.length?x.chosenTags:x.tags).join('、')}`).join('\n')||'暂无'}\n\n## 有点喜欢的点子\n${likes().filter(x=>x.status==='like').map(x=>`- ${x.title}：${x.summary}`).join('\n')||'暂无'}\n\n## 屏蔽标签\n${state.blocked.join('、')||'暂无'}\n\n_由 IDEA SWIPE 交互演示原型生成_\n`;download('IDEA-SWIPE-概念摘要.md',md,'text/markdown;charset=utf-8');toast('Markdown 概念摘要已导出')}
function render(){renderSteps();renderLeft();renderRight();$('#main').classList.remove('wide');if(state.stage==='browse')renderBrowse();else if(state.stage==='map')renderMap();else if(state.stage==='compare')renderCompare();else if(state.stage==='winner')renderWinner();else{state.stage='browse';renderBrowse()}}
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)stepNav(b.dataset.step)});$('#resetBtn').addEventListener('click',()=>{if(!confirm('确定清空所有卡片、标签和二选一记录吗？此操作不可撤销。'))return;state=defaultState();undoSnapshot=null;mapFilter='all';closeModal();persist();render();toast('已经重置为新的探索会话')});window.addEventListener('keydown',e=>{if(modal.type){if(e.key==='Escape')closeModal();return}if(/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;if(state.stage==='browse'&&active()){if(e.key==='ArrowRight')assess('like');if(e.key==='ArrowLeft')assess('no');if(e.key==='ArrowUp'){e.preventDefault();assess('super')}}if(state.stage==='compare'&&state.duel){if(e.key==='1')vote(state.duel.champion);if(e.key==='2')vote(state.duel.ids[state.duel.index])}});
render();if(['https:','http:'].includes(location.protocol)){fetch('/api/health',{cache:'no-store'}).then(x=>x.ok?x.json():null).then(data=>{if(data?.connected){aiConnected=true;aiModel=data.model||'AI';const el=$('#aiModeText');if(el)el.textContent='✳ 已连接实时 AI · '+aiModel;toast('已连接实时 AI，输入主题即可生成创意卡')} }).catch(()=>{})}if(!state.cards.length)toast('先输入课题，或点击「体验示例卡片」开始');
})();
</script>
